name: Selenium CI

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 18
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '18'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: Decide Cucumber tags
        id: tags
        shell: bash
        run: |
          if [ "${{ github.base_ref }}" = "develop" ]; then
            echo 'filter=@pr and not (@wip or @flaky)' >> $GITHUB_OUTPUT
          elif [ "${{ github.base_ref }}" = "main" ]; then
            echo 'filter=@release and not (@wip or @flaky)' >> $GITHUB_OUTPUT
          else
            echo "Unsupported base branch: ${{ github.base_ref }}"
            exit 1
          fi

      - name: Generate es_CL locale
        run: |
          sudo locale-gen es_CL.UTF-8
          sudo update-locale

      - name: Run tests
        run: mvn clean test -Denvironment=qa -Dbrowser=${{ matrix.browser }} -Dcucumber.filter.tags="${{ steps.tags.outputs.filter }}"

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: target/allure-results

  allure-report:
    needs: tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        browser: [chrome, firefox]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 18
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '18'

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: target/allure-results

      - name: Generate Allure report
        run: mvn allure:report

      - name: Upload Allure site
        uses: actions/upload-artifact@v4
        with:
          name: allure-site-${{ matrix.browser }}
          path: target/site/allure-maven-plugin

  publish-pages:
    needs: allure-report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all Allure sites
        uses: actions/download-artifact@v4
        with:
          path: public

      - name: Create root index.html
        run: |
          cat <<EOF > public/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>Allure Reports</title>
            <style>
              body { font-family: Arial; padding: 40px; }
              ul { font-size: 18px; }
            </style>
          </head>
          <body>
            <h1>Automation Test Reports</h1>
            <ul>
              <li><a href="./allure-site-chrome/">Chrome Report</a></li>
              <li><a href="./allure-site-firefox/">Firefox Report</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          publish_branch: gh-pages
